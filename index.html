<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EarthSync Breath Pacer</title>
  <meta name="description" content="Harmonic Breath Pacer and Photic Visualizer. Synchronize breath pacing rhythms with harmonic soundscapes and visual entrainment.">
  <meta property="og:title" content="EarthSync Breath Pacer">
  <meta property="og:description" content="Harmonic Breath Pacer and Photic Visualizer. Synchronize breath pacing rhythms with harmonic soundscapes and visual entrainment.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* HARD LOCK THE DOM LAYER */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      background: #020617;
      color: #f8fafc;
      position: fixed;
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: none;
    }

    #root {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden !important;
    }

    /* GLOBAL SCROLLBAR HIDING RULE ACROSS ENTIRE APP & ALL DROPDOWNS */
    *, *::before, *::after {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar,
    .custom-scrollbar::-webkit-scrollbar,
    .no-scrollbar::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    .custom-scrollbar,
    .no-scrollbar {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    .spiritual-title {
      font-family: 'Cinzel', serif;
    }
    .glow-purple { text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
    .glow-gold { text-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.2; }
      100% { transform: scale(0.8); opacity: 0.5; }
    }
    .pulse-animation {
      animation: pulse-ring 3s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
